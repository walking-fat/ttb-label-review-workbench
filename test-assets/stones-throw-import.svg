<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 900 1300" role="img" aria-labelledby="title desc">
  <title id="title">Stone's Throw import sample label</title>
  <desc id="desc">A sample import label with punctuation differences that should route to clear or check instead of a hard mismatch.</desc>
  <rect width="900" height="1300" fill="#eef3f0"/>
  <rect x="75" y="75" width="750" height="1150" fill="#fbfbf3" stroke="#24453f" stroke-width="9"/>
  <text x="450" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#24453f">Stones Throw</text>
  <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#24453f">Highland Single Malt Scotch Whisky</text>
  <line x1="150" y1="330" x2="750" y2="330" stroke="#9b7c40" stroke-width="3"/>
  <text x="145" y="425" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1b2a3b">43% Alc./Vol. (86 Proof)</text>
  <text x="145" y="485" font-family="Arial, sans-serif" font-size="33" fill="#1b2a3b">750 ml</text>
  <text x="145" y="545" font-family="Arial, sans-serif" font-size="30" fill="#1b2a3b">Produced by Stones Throw Spirits, Inverness Scotland</text>
  <text x="145" y="605" font-family="Arial, sans-serif" font-size="30" fill="#1b2a3b">Product of Scotland</text>
  <text x="145" y="665" font-family="Arial, sans-serif" font-size="30" fill="#1b2a3b">Imported by Cascade Importers, Seattle WA</text>
  <rect x="135" y="760" width="630" height="300" fill="#edf4ef" stroke="#24453f" stroke-width="3"/>
  <text x="165" y="820" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1b2a3b">GOVERNMENT WARNING:</text>
  <text x="165" y="875" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">(1) According to the Surgeon General, women should</text>
  <text x="165" y="915" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">not drink alcoholic beverages during pregnancy because of the risk of birth defects.</text>
  <text x="165" y="955" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">(2) Consumption of alcoholic beverages impairs your ability to drive a car</text>
  <text x="165" y="995" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">or operate machinery, and may cause health problems.</text>
  <text x="450" y="1140" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#55706b">Local test fixture - fuzzy text case</text>
</svg>
