<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 900 1300" role="img" aria-labelledby="title desc">
  <title id="title">Blue Harbor Rum incomplete application sample label</title>
  <desc id="desc">A rum sample where the application fixture intentionally omits class/type.</desc>
  <rect width="900" height="1300" fill="#eff7f9"/>
  <rect x="80" y="80" width="740" height="1140" rx="16" fill="#fcfff9" stroke="#1e4c5c" stroke-width="10"/>
  <text x="450" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#1e4c5c">BLUE HARBOR RUM</text>
  <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#1e4c5c">Caribbean White Rum</text>
  <line x1="160" y1="330" x2="740" y2="330" stroke="#63a9b4" stroke-width="3"/>
  <text x="145" y="425" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1b2a3b">40% Alc./Vol. (80 Proof)</text>
  <text x="145" y="485" font-family="Arial, sans-serif" font-size="33" fill="#1b2a3b">750 mL</text>
  <text x="145" y="545" font-family="Arial, sans-serif" font-size="30" fill="#1b2a3b">Bottled by Blue Harbor Spirits, San Juan, PR</text>
  <rect x="135" y="700" width="630" height="310" fill="#ecf7f8" stroke="#1e4c5c" stroke-width="3"/>
  <text x="165" y="765" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1b2a3b">GOVERNMENT WARNING:</text>
  <text x="165" y="820" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">(1) According to the Surgeon General, women should</text>
  <text x="165" y="860" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">not drink alcoholic beverages during pregnancy because of the risk of birth defects.</text>
  <text x="165" y="900" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">(2) Consumption of alcoholic beverages impairs your ability to drive a car</text>
  <text x="165" y="940" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">or operate machinery, and may cause health problems.</text>
  <text x="450" y="1140" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4d7180">Local test fixture - incomplete application case</text>
</svg>
