<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 900 1300" role="img" aria-labelledby="title desc">
  <title id="title">Old Tom Distillery bourbon sample label</title>
  <desc id="desc">A clear distilled spirits label sample with matching application facts.</desc>
  <rect width="900" height="1300" fill="#f7f2e7"/>
  <rect x="70" y="70" width="760" height="1160" rx="18" fill="#fffaf0" stroke="#25364a" stroke-width="10"/>
  <rect x="105" y="105" width="690" height="1090" rx="10" fill="none" stroke="#9b7c40" stroke-width="4"/>
  <text x="450" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#1b2a3b">OLD TOM DISTILLERY</text>
  <text x="450" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" fill="#1b2a3b">Kentucky Straight Bourbon Whiskey</text>
  <line x1="165" y1="330" x2="735" y2="330" stroke="#9b7c40" stroke-width="3"/>
  <text x="145" y="425" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1b2a3b">45% Alc./Vol. (90 Proof)</text>
  <text x="145" y="485" font-family="Arial, sans-serif" font-size="33" fill="#1b2a3b">Net Contents 750 mL</text>
  <text x="145" y="545" font-family="Arial, sans-serif" font-size="30" fill="#1b2a3b">Bottled by Old Tom Distillery, Bardstown, KY</text>
  <rect x="135" y="690" width="630" height="310" fill="#f4ead2" stroke="#25364a" stroke-width="3"/>
  <text x="165" y="755" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1b2a3b">GOVERNMENT WARNING:</text>
  <text x="165" y="810" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">(1) According to the Surgeon General, women should</text>
  <text x="165" y="850" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">not drink alcoholic beverages during pregnancy</text>
  <text x="165" y="890" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">because of the risk of birth defects. (2)</text>
  <text x="165" y="930" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">Consumption of alcoholic beverages impairs your</text>
  <text x="165" y="970" font-family="Arial, sans-serif" font-size="25" fill="#1b2a3b">ability to drive a car or operate machinery, and may cause health problems.</text>
  <text x="450" y="1135" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#6b5b3d">Local test fixture - clear match case</text>
</svg>
